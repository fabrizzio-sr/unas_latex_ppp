name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre de la versión o tag (ej. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Compilar y Publicar Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Determinar versión y Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag a publicar: $TAG"

      - name: Compilar documento con LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_lualatex: true

      - name: Preparar artefactos del Release
        run: |
          TAG="${{ steps.vars.outputs.tag }}"

          # 1. Copiar y estandarizar nombre del PDF compilado
          if [ -f "build/main.pdf" ]; then
            cp "build/main.pdf" "informe_ppp.pdf"
          elif [ -f "main.pdf" ]; then
            cp "main.pdf" "informe_ppp.pdf"
          else
            echo "Error: No se encontró el PDF compilado."
            exit 1
          fi
          cp "informe_ppp.pdf" "informe_ppp_${TAG}.pdf"

          # 2. Empaquetar plantilla limpia en archivo ZIP para los usuarios
          zip -r "unas_latex_ppp_plantilla_${TAG}.zip" . \
            -x "*.git*" \
            -x "*.github*" \
            -x "build/*" \
            -x "*.pdf" \
            -x "*.synctex.gz" \
            -x "*.log" \
            -x "*.aux"

          echo "Artefactos preparados con éxito:"
          ls -lh informe_ppp.pdf "informe_ppp_${TAG}.pdf" "unas_latex_ppp_plantilla_${TAG}.zip"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            informe_ppp.pdf
            informe_ppp_${{ steps.vars.outputs.tag }}.pdf
            unas_latex_ppp_plantilla_${{ steps.vars.outputs.tag }}.zip
